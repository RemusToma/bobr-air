; BÓBR AIR, the finished firmware (the same as the web installer)
;
; Two versions of the board exist. Pick yours:
;   pio run -e cyd -t upload        one USB port  (display ILI9341)
;   pio run -e cyd2usb -t upload    two USB ports (display ST7789)
; From the repo root add -d examples/bobr-air, for example: pio run -d examples/bobr-air -e cyd -t upload
; Serial monitor:  pio device monitor
;
; platform 6.13.0 = Arduino core 2.0.17. huge_app = 3 MB for the program, no OTA.
; TFT_eSPI is configured with the flags below, never in its User_Setup.h.

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git#V2.5.43
    https://github.com/boschsensortec/Bosch-BME68x-Library.git#v1.3.40408
    https://github.com/boschsensortec/Bosch-BSEC2-Library.git#1.10.2610
build_flags =
    -DUSER_SETUP_LOADED
    -DUSE_HSPI_PORT
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DDISABLE_ALL_LIBRARY_WARNINGS

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF
    -DCYD2USB
